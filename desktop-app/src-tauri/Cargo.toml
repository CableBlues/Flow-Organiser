[package]
name = "noodle-desktop"
version = "2.0.0"
description = "Noodle Desktop Application - Mind Planner & Daily Focus"
authors = ["Noodle Studio Team"]
edition = "2021"

[lib]
name = "noodle_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-updater = "2.0.0"
tauri-plugin-process = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
