<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0a0a0f] text-[#f4f4f5]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>🌊 Flow — Daily Planner & Focus</title>

  <!-- Web App Manifest für PWA & Offline-Installation -->
  <link rel="manifest" href="manifest.json" />

  <!-- Hochauflösendes, elegantes Flow-Favicon & Apple Touch Icon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="icon-192.svg" />

  <!-- Lokale Offline-Bibliotheken (100% autark, offline & DSGVO-konform ohne CDN-Abhängigkeit) -->
  <script src="vendor/tailwindcss.js"></script>
  <script src="vendor/lucide.min.js"></script>
  <script src="vendor/supabase.min.js"></script>

  <!-- Google Fonts mit Unterstützung für Handschrift (Caveat) und klassischen Serif-Stil (Playfair Display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700;900&family=Caveat:wght@400;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

  <!--
    PERFORMANCE-FIX:
    - html2canvas wurde bisher hier eager geladen, aber nirgends im Code tatsaechlich benutzt
      (keine einzige Referenz in allen .js-Dateien) -> komplett entfernt, keine Funktionsaenderung.
    - Three.js + OrbitControls werden nur fuer den 3D-Spielmodus benoetigt und jetzt erst beim
      ersten Oeffnen des Spielmodus dynamisch nachgeladen (siehe ensureThreeJsLoaded() in
      gamification.js), statt bei jedem Seitenaufruf.
  -->

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- Externe Stylesheet-Verknüpfung mit Cache-Buster -->
  <link rel="stylesheet" href="styles-base-1.css?v=1">
  <link rel="stylesheet" href="styles-base-2.css?v=1">
  <link rel="stylesheet" href="styles-animations.css?v=1">
  <link rel="stylesheet" href="styles-dock.css?v=1">
  <link rel="stylesheet" href="styles-hover.css?v=1">
  <link rel="stylesheet" href="styles-mobile.css?v=1">

</head>
<body class="h-full antialiased flex flex-col font-sans select-none overflow-x-hidden text-[#f4f4f5] bg-[#12121a]">

  <!--
    Der Body-Inhalt (App-Oberfläche, Modals, 3D-Spielmodus) wurde aus dieser Datei ausgelagert,
    damit index.html unter 450 Zeilen bleibt. Die folgenden Skripte fügen ihren HTML-Inhalt per
    document.write() exakt an dieser Stelle im Dokument ein - das Ergebnis im Browser ist
    identisch zur ursprünglichen, einteiligen index.html (gleiche DOM-Struktur, gleiche Reihenfolge).
    Reihenfolge NICHT verändern.
  -->
  <div id="app" class="min-h-screen max-w-[1920px] w-full mx-auto flex flex-col p-3 md:p-5 select-none justify-between relative">
    <script src="partial-app-1.js"></script>
    <script src="partial-app-2.js"></script>
    <script src="partial-app-3.js"></script>
  </div>
  <script src="partial-modals-1.js"></script>
  <script src="partial-modals-2.js"></script>

  <script src="data-tasks-steps-1.js"></script>
  <script src="data-tasks-steps-2.js"></script>
  <script src="data-tasks-steps-3.js"></script>
  <script src="data-tasks.js"></script>
  <script src="data-translations-1.js"></script>
  <script src="data-translations-2.js"></script>
  <script src="data-translations.js"></script>
  <script src="data-custom-translations.js"></script>
  <script src="data-extras.js"></script>
  <script src="storage.js"></script>
  <script src="state.js"></script>
  <script src="sync-engine.js"></script>
  <script src="utils-data.js"></script>
  <script src="utils.js"></script>
  <script src="utils-2.js"></script>
  <script src="audio-core.js"></script>
  <script src="audio-generators.js"></script>
  <script src="audio-scheduler-1.js"></script>
  <script src="audio-scheduler-2.js"></script>
  <script src="audio-scheduler-3.js"></script>
  <script src="audio-player.js"></script>
  <script src="timer-1.js"></script>
  <script src="timer-2.js"></script>
  <script src="timer-3.js"></script>
  <script src="helper-core-data.js"></script>
  <script src="helper-core.js"></script>
  <script src="helper-core-2.js"></script>
  <script src="helper-tools-1.js"></script>
  <script src="helper-tools-2.js"></script>
  <script src="helper-tools-3.js"></script>
  <script src="helper-clarity.js"></script>
  <script src="sport.js"></script>
  <script src="gamification.js"></script>
  <script src="gamification-2.js"></script>
  <script src="app-core.js"></script>
  <script src="app-shopping.js"></script>
  <script src="app-cooking.js"></script>
  <script src="app-alarm.js"></script>
  <script src="app-tasks.js"></script>
  <script src="app-reports.js"></script>
  <script src="app-weather-news.js"></script>
  <script src="app-dice.js"></script>

  <!-- Service Worker Registrierung für 100% Offline-Fähigkeit & Blitzstart (nur über HTTP/HTTPS) -->
  <script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          console.log('Flow Service Worker aktiv:', reg.scope);
        }).catch((err) => {
          console.warn('Service Worker Registrierung fehlgeschlagen:', err);
        });
      });
    }
  </script>
</body>
</html>
