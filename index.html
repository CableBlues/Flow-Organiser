  <!--
    PERFORMANCE-FIX:
    - html2canvas wurde bisher hier eager geladen, aber nirgends im Code tatsaechlich benutzt
      (keine einzige Referenz in allen .js-Dateien) -> komplett entfernt, keine Funktionsaenderung.
    - Three.js + OrbitControls werden nur fuer den 3D-Spielmodus benoetigt und jetzt erst beim
      ersten Oeffnen des Spielmodus dynamisch nachgeladen (siehe ensureThreeJsLoaded() in
      gamification.js), statt bei jedem Seitenaufruf.
  -->

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
          },
        },
      },
    }
  </script>
