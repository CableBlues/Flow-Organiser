<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#121124"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <linearGradient id="flow-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="flow-grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded App Tile -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)"/>
  <rect width="506" height="506" x="3" y="3" rx="118" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>

  <!-- Radial Core Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#core-glow)" opacity="0.6"/>

  <!-- Primary Flow Ribbon -->
  <path d="M 80,256 C 140,110 230,400 330,256 C 375,190 420,200 435,256 C 445,315 400,330 350,256 C 255,110 165,400 80,256 Z" 
        fill="url(#flow-grad1)" 
        opacity="0.95" 
        filter="url(#glow)"/>

  <!-- Intertwined Counter Ribbon -->
  <path d="M 432,256 C 372,402 282,112 182,256 C 137,322 92,312 77,256 C 67,197 112,182 162,256 C 257,402 347,112 432,256 Z" 
        fill="url(#flow-grad2)" 
        opacity="0.85" 
        style="mix-blend-mode: screen;"/>
  
  <!-- Orbiting Light Spark -->
  <circle cx="330" cy="256" r="20" fill="#ffffff" filter="url(#glow)"/>
</svg>
